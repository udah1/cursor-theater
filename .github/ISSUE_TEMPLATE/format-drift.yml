name: Rendering / data report
description: A conversation renders oddly (wrong title, status, timer, or a missing project room)
title: "[render] "
labels: ["rendering"]
body:
  - type: markdown
    attributes:
      value: |
        Cursor Theater reads transcripts under `~/.cursor/projects` and chat
        metadata from `state.vscdb`. If something renders wrong, a **scrubbed**
        sample helps a lot. **Never paste unscrubbed transcript content** — these
        files contain real conversation text. Replace every prompt/result with
        placeholder text and keep only the structure.
  - type: input
    id: cursor-version
    attributes:
      label: Cursor version & OS
      placeholder: "Cursor 1.x, macOS 15"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What looked wrong?
      description: A mislabeled or empty conversation, a missing project room, wrong status or timer…
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Scrubbed transcript sample (optional)
      description: A few representative lines, with all real prompt/result text replaced.
      render: json
  - type: checkboxes
    id: scrubbed
    attributes:
      label: Privacy
      options:
        - label: I removed all real prompt/result content from any sample above.
          required: true
