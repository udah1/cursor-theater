name: Bug report
description: Something doesn't work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Cursor version, and whether you're using the extension or the Python server.
      placeholder: "macOS 15, Cursor 1.x, extension 0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output (optional)
      description: Anything Cursor Theater printed (terminal or the extension's Output channel). Redact any paths/content you'd rather not share.
      render: text
