name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: build extension (.vsix)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Verify the shared UI is in sync
        run: |
          python3 build_ui.py
          git diff --exit-code cursor_theater.py \
            || { echo "::error::ui/theater.html changed but cursor_theater.py was not regenerated (run build_ui.py)"; exit 1; }
      - name: Install
        working-directory: extension
        run: npm ci
      - name: Compile (tsc)
        working-directory: extension
        run: npm run compile
      - name: Package
        working-directory: extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-theater-vsix
          path: extension/*.vsix

  python:
    name: python server (syntax + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m py_compile cursor_theater.py build_ui.py
      - name: Lint (ruff — real bugs only)
        run: pipx run ruff check cursor_theater.py build_ui.py
